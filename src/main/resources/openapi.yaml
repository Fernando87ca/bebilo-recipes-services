---
openapi: 3.0.3
info:
  title: Bebilo Recipes Service
  version: 1.2.0
  description: Consulta y creación de recetas por cuenta Firebase. POST devuelve Created y genera contenido
    con Koog fuera de la petición HTTP. Los GET leen el contenido persistido sin consultar AI Configuration
    ni Babies.
servers:
- url: http://api.bebilo.localhost:8088/recipes
  description: Gateway local
- url: http://localhost:8084
  description: Servicio local directo
paths:
  /v1/recipes:
    get:
      operationId: getRecipes
      tags:
      - Recipes
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Recetas persistidas; Created/Loading/Error pueden no tener instrucciones todavía.
            Ready requiere instrucciones completas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipesResponseDto'
        '401':
          description: Se requiere un token Bearer válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                code: UNAUTHORIZED
                message: Se requiere un token Bearer válido
        '403':
          description: Acceso al servicio no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                code: FORBIDDEN
                message: Acceso al servicio no permitido
        '500':
          description: Error interno o contenido persistido inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                code: INTERNAL_ERROR
                message: Error interno o contenido persistido inválido
        '503':
          description: Servicio temporalmente no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                code: SERVICE_UNAVAILABLE
                message: Servicio temporalmente no disponible
      description: 'Biblioteca completa sin filtros, paginación ni límite implícito. Cuenta sin recetas:
        200 {"recipes":[]}. Los errores no producen listados vacíos o parciales.'
  /v1/recipes/events:
    get:
      operationId: observeRecipeStatuses
      tags: [Recipes]
      security:
      - bearerAuth: []
      description: >-
        SSE por cuenta. Envía un evento recipe-status por receta en el snapshot inicial,
        seguido de altas y cambios de estado. El id es summary.id, nunca el ID físico.
        Cuenta vacía mantiene conexión; Ready/Error no la cierran. Comentario heartbeat
        cada 30 segundos. Sin eventos para cambios de contenido sin cambio de estado
        ni eliminaciones. Sin historial, IDs SSE ni replay de Last-Event-ID; reconectar
        sincroniza el estado actual y puede omitir estados intermedios. Fallos posteriores
        al inicio y cola llena cierran el stream sin JSON. Cada evento data contiene
        exclusivamente RecipeStatusEventDto.
      responses:
        '200':
          description: Stream continuo de estados persistidos de la cuenta autenticada
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ["private, no-store"]
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: recipe-status
                data: {"id":"recipe-id","status":"Loading"}

        '401':
          description: Bearer ausente o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Auth deniega acceso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Contenido inválido, IDs duplicados o error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Auth/Firestore indisponible o snapshot inicial excede 10 segundos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /v1/recipe/{recipeId}:
    get:
      operationId: getRecipe
      tags:
      - Recipes
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Recetas persistidas; Created/Loading/Error pueden no tener instrucciones todavía.
            Ready requiere instrucciones completas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDto'
        '400':
          description: Identificador de receta inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                code: VALIDATION_ERROR
                message: Identificador de receta inválido
        '401':
          description: Se requiere un token Bearer válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                code: UNAUTHORIZED
                message: Se requiere un token Bearer válido
        '403':
          description: Acceso al servicio no permitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                code: FORBIDDEN
                message: Acceso al servicio no permitido
        '404':
          description: Receta no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                code: NOT_FOUND
                message: Receta no encontrada
        '500':
          description: Error interno o contenido persistido inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                code: INTERNAL_ERROR
                message: Error interno o contenido persistido inválido
        '503':
          description: Servicio temporalmente no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              example:
                code: SERVICE_UNAVAILABLE
                message: Servicio temporalmente no disponible
      parameters:
      - name: recipeId
        in: path
        required: true
        description: ID opaco no blanco, codificado como un único segmento y decodificado una vez. No
          exige UUID. Inexistente o ajeno devuelve el mismo 404.
        schema:
          type: string
          minLength: 1
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Servicio activo
          content:
            text/plain:
              schema:
                type: string
              example: OK
  /v1/recipe:
    post:
      operationId: createRecipe
      tags:
      - Recipes
      security:
      - bearerAuth: []
      description: Consulta configuración de IA y bebés de la cuenta, persiste la receta inicial y devuelve
        Created. La generación continúa fuera del HTTP. Cada POST aceptado crea una receta nueva; sin
        reintentos ni recuperación tras reinicio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecipeRequest'
            example:
              babyIds:
              - baby-id
              ingredients:
              - name: Patata
                category: vegetables
                allergens: []
              cookingMethods:
              - steam
      responses:
        '200':
          description: Receta inicial persistida, status Created. No espera al LLM.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeDto'
        '400':
          description: Solicitud de creación inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Bearer ausente o inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Acceso no permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Bebé no disponible para esta cuenta. Código BABY_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '502':
          description: Respuesta inválida de AI Configuration o Babies. Código DEPENDENCY_ERROR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Auth, servicios dependientes o Firestore indisponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Error interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /v1/recipe/{recipeId}/images/{imageId}:
    get:
      operationId: getRecipeImage
      tags:
      - Recipes
      security:
      - bearerAuth: []
      parameters:
      - name: recipeId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: JPEG privado; requiere Bearer de la cuenta propietaria.
          headers:
            Cache-Control:
              schema:
                type: string
              example: private, no-store
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '400':
          description: Identificadores inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Bearer ausente o inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Acceso no permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Receta o imagen inexistente o ajena.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Almacenamiento o Auth indisponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '500':
          description: Error interno o referencia persistida inválida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    RecipeStatusDto:
      type: string
      enum: [Created, Loading, Error, Ready]
    RecipeStatusEventDto:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
          minLength: 1
          pattern: \S
          description: Identidad pública opaca summary.id
        status:
          $ref: '#/components/schemas/RecipeStatusDto'
    RecipeImageDto:
      type: object
      properties:
        url:
          type: string
          format: uri
          minLength: 1
          pattern: ^https?://
        altText:
          type: string
          nullable: true
          minLength: 1
          pattern: \S
      required:
      - url
      nullable: true
    RecipeBabyDto:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          pattern: \S
        name:
          type: string
          minLength: 1
          pattern: \S
      required:
      - id
      - name
    RecipeAllergenDto:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: \S
        name:
          type: string
          minLength: 1
          pattern: \S
      required:
      - code
      - name
    RecipeSummaryDto:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          pattern: \S
        title:
          type: string
          minLength: 1
          pattern: \S
        babies:
          type: array
          items:
            $ref: '#/components/schemas/RecipeBabyDto'
          minItems: 1
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/RecipeAllergenDto'
        coverImage:
          $ref: '#/components/schemas/RecipeImageDto'
        recommendedAgeMonths:
          type: integer
          minimum: 0
          nullable: true
        totalMinutes:
          type: integer
          minimum: 0
          nullable: true
        texture:
          type: string
          nullable: true
          minLength: 1
          pattern: \S
        tags:
          type: array
          items:
            type: string
          default: []
      required:
      - id
      - title
      - babies
      - allergens
    RecipeIngredientDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
        allergens:
          type: array
          items:
            $ref: '#/components/schemas/RecipeAllergenDto'
        category:
          type: string
          description: Categoría explícita obligatoria en todos los estados, incluidos Created/Loading/Error.
          enum:
          - vegetables
          - fruit
          - protein
          - dairy
          - cereal
          - seeds
          - oil_and_fats
          - sweet
        catalogId:
          type: string
          nullable: true
          minLength: 1
          pattern: \S
        quantity:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          nullable: true
        unit:
          type: string
          nullable: true
          minLength: 1
          pattern: \S
        preparation:
          type: string
          nullable: true
          minLength: 1
          pattern: \S
      required:
      - name
      - allergens
      - category
    RecipeStepDto:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          pattern: \S
        text:
          type: string
          minLength: 1
          pattern: \S
        title:
          type: string
          nullable: true
          minLength: 1
          pattern: \S
        durationMinutes:
          type: integer
          minimum: 0
          nullable: true
        image:
          $ref: '#/components/schemas/RecipeImageDto'
      required:
      - id
      - text
    RecipeParagraphDto:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          pattern: \S
        text:
          type: string
          minLength: 1
          pattern: \S
        image:
          $ref: '#/components/schemas/RecipeImageDto'
      required:
      - id
      - text
    RecipeStepsDto:
      type: object
      properties:
        type:
          type: string
          enum:
          - steps
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RecipeStepDto'
          minItems: 0
      required:
      - type
      - steps
      not:
        required:
        - paragraphs
    RecipeNarrativeDto:
      type: object
      properties:
        type:
          type: string
          enum:
          - narrative
        paragraphs:
          type: array
          items:
            $ref: '#/components/schemas/RecipeParagraphDto'
          minItems: 0
      required:
      - type
      - paragraphs
      not:
        required:
        - steps
    RecipeInstructionsDto:
      oneOf:
      - $ref: '#/components/schemas/RecipeStepsDto'
      - $ref: '#/components/schemas/RecipeNarrativeDto'
      discriminator:
        propertyName: type
        mapping:
          steps: '#/components/schemas/RecipeStepsDto'
          narrative: '#/components/schemas/RecipeNarrativeDto'
    RecipeDto:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/RecipeStatusDto'
        summary:
          $ref: '#/components/schemas/RecipeSummaryDto'
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredientDto'
          minItems: 1
        cookingMethods:
          type: array
          items:
            type: string
          minItems: 1
        instructions:
          $ref: '#/components/schemas/RecipeInstructionsDto'
        imageMode:
          type: string
          enum:
          - none
          - cover
          - contextual
        description:
          type: string
          nullable: true
          minLength: 1
          pattern: \S
        preparationMinutes:
          type: integer
          minimum: 0
          nullable: true
        cookingMinutes:
          type: integer
          minimum: 0
          nullable: true
        servings:
          type: integer
          minimum: 1
          nullable: true
        storageNotes:
          type: string
          nullable: true
          minLength: 1
          pattern: \S
        adaptationNotes:
          type: string
          nullable: true
          minLength: 1
          pattern: \S
        createdAt:
          type: string
          format: date-time
          nullable: true
          minLength: 1
          pattern: \S
        updatedAt:
          type: string
          format: date-time
          nullable: true
          minLength: 1
          pattern: \S
      required:
      - status
      - summary
      - ingredients
      - cookingMethods
      - instructions
      - imageMode
      allOf:
      - oneOf:
        - type: object
          properties:
            status:
              type: string
              enum:
              - Ready
            instructions:
              oneOf:
              - $ref: '#/components/schemas/ReadyRecipeStepsDto'
              - $ref: '#/components/schemas/ReadyRecipeNarrativeDto'
        - type: object
          properties:
            status:
              type: string
              enum:
              - Created
              - Loading
              - Error
    RecipesResponseDto:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeDto'
      required:
      - recipes
    ApiErrorResponse:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          pattern: \S
        message:
          type: string
          minLength: 1
          pattern: \S
      required:
      - code
      - message
    ReadyRecipeStepsDto:
      allOf:
      - $ref: '#/components/schemas/RecipeStepsDto'
      - type: object
        properties:
          steps:
            type: array
            minItems: 1
    ReadyRecipeNarrativeDto:
      allOf:
      - $ref: '#/components/schemas/RecipeNarrativeDto'
      - type: object
        properties:
          paragraphs:
            type: array
            minItems: 1
    CreateRecipeRequest:
      type: object
      required:
      - babyIds
      - ingredients
      - cookingMethods
      properties:
        babyIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            pattern: \S
        ingredients:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecipeIngredientDto'
        cookingMethods:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            pattern: \S
        title:
          type: string
          nullable: true
          minLength: 1
          pattern: \S
        servings:
          type: integer
          nullable: true
          minimum: 1
        additionalInstructions:
          type: string
          nullable: true
          minLength: 1
          pattern: \S
